<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arequipa Accesible - Nuevo reporte</title>
  <style>
    body { font-family: Arial, sans-serif; font-size: 20px; margin: 0; background: #f4f6fa; color: #111; }
    header { background: #1F3864; color: #fff; padding: 16px 24px; font-size: 24px; font-weight: bold; }
    main { max-width: 720px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin: 20px 0 6px; font-weight: bold; }
    input, select, textarea { width: 100%; font-size: 20px; padding: 12px; box-sizing: border-box; border: 2px solid #1F3864; border-radius: 6px; }
    button { font-size: 22px; padding: 16px 24px; margin-top: 24px; background: #1F3864; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    button.secundario { background: #fff; color: #1F3864; border: 2px solid #1F3864; margin-top: 8px; font-size: 18px; padding: 10px 16px; }
    #mensaje { margin-top: 24px; padding: 16px; border-radius: 6px; display: none; font-weight: bold; }
    #mensaje.ok { display: block; background: #e2efda; border: 2px solid #2e7d32; }
    #mensaje.error { display: block; background: #fde7e9; border: 2px solid #b00020; }
  </style>
</head>
<body>
  <header>Arequipa Accesible</header>
  <main>
    <h1>Nuevo reporte</h1>
    <form id="form-reporte">
      <label for="foto">1. Fotografía de la barrera</label>
      <input type="file" id="foto" name="foto" accept="image/jpeg,image/png" capture="environment" required>

      <label for="id_tipo">2. Tipo de barrera</label>
      <select id="id_tipo" name="id_tipo" required>
        <option value="">Seleccione...</option>
        {% for id, nombre in tipos.items() %}<option value="{{ id }}">{{ nombre }}</option>{% endfor %}
      </select>

      <label for="latitud">3. Ubicación</label>
      <input type="text" id="latitud" name="latitud" placeholder="Latitud (ej. -16.3989)" required>
      <input type="text" id="longitud" name="longitud" placeholder="Longitud (ej. -71.5350)" required style="margin-top:8px">
      <button type="button" class="secundario" id="btn-ubicacion">Usar mi ubicación actual</button>

      <label for="descripcion">4. Descripción breve</label>
      <textarea id="descripcion" name="descripcion" rows="3" maxlength="500" required></textarea>

      <button type="submit">Enviar reporte</button>
    </form>
    <div id="mensaje" role="status" aria-live="polite"></div>
  </main>
  <script>
    const msg = document.getElementById('mensaje');
    document.getElementById('btn-ubicacion').addEventListener('click', () => {
      if (!navigator.geolocation) { return; }
      navigator.geolocation.getCurrentPosition(p => {
        document.getElementById('latitud').value = p.coords.latitude.toFixed(6);
        document.getElementById('longitud').value = p.coords.longitude.toFixed(6);
      });
    });
    document.getElementById('form-reporte').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = ''; msg.textContent = '';
      const resp = await fetch('/api/reportes', { method: 'POST', body: new FormData(e.target) });
      const datos = await resp.json();
      if (resp.ok) {
        msg.className = 'ok';
        msg.textContent = 'Reporte registrado. Su número de caso es ' + datos.codigo_caso + ' (estado: ' + datos.estado + ').';
        e.target.reset();
      } else {
        msg.className = 'error';
        msg.textContent = datos.error;
      }
    });
  </script>
</body>
</html>
